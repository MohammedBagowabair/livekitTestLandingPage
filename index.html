<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>وصل أكاديمي — جلسة فيديو مباشرة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.8/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="shell">
    <header class="hero">
      <p class="brand">وصل أكاديمي</p>
      <h1>جلسة فيديو مباشرة</h1>
      <p class="lede">انضم لغرفة تجريبية مباشرة عبر واجهة وصل أكاديمي. لا يتم تسجيل أو حفظ الفيديو في هذا العرض.</p>
    </header>

    <section class="panel" id="join-panel" aria-labelledby="join-heading">
      <h2 id="join-heading" class="sr-only">بيانات الانضمام</h2>

      <label class="field">
        <span>عنوان واجهة البرمجة (API)</span>
        <input id="apiBaseUrl" type="url" autocomplete="off" placeholder="https://api.waslacademy.net" value="https://api.waslacademy.net" />
      </label>
      <p class="hint">
        لا حاجة لتسجيل دخول أو لصق JWT. اختر اسم عرض واسم غرفة ثم انضم.
        يتطلب مسار تجربة مجهول على الـ API مع تفعيل LiveKit على الخادم.
      </p>

      <div class="row">
        <label class="field">
          <span>اسم العرض</span>
          <input id="displayName" type="text" autocomplete="nickname" placeholder="مثال: المعلمة سارة" />
        </label>
        <label class="field">
          <span>اسم الغرفة</span>
          <input id="roomName" type="text" autocomplete="off" placeholder="demo-room-1" />
        </label>
      </div>

      <label class="check">
        <input id="enableCamera" type="checkbox" />
        <span>تشغيل الكاميرا عند الانضمام (اتركه مغلقاً عند تجربة متصفحين على نفس الجهاز)</span>
      </label>

      <div class="actions">
        <button type="button" id="joinBtn" class="btn primary">انضم للجلسة</button>
        <button type="button" id="toggleCameraBtn" class="btn ghost" disabled>إيقاف الكاميرا</button>
        <button type="button" id="leaveBtn" class="btn ghost" disabled>مغادرة</button>
        <button type="button" id="suggestRoomBtn" class="btn link">اقتراح اسم غرفة</button>
      </div>

      <p id="status" class="status" role="status">جاهز للانضمام.</p>
    </section>

    <section class="stage" id="stage" hidden>
      <div class="meet-toolbar">
        <span id="roomBadge" class="room-badge"></span>
        <div class="meet-controls">
          <button type="button" id="toggleMicBtn" class="ctrl-btn" disabled title="ميكروفون">🎤</button>
          <button type="button" id="toggleCameraBtnBar" class="ctrl-btn" disabled title="كاميرا">📷</button>
          <button type="button" id="leaveBtnBar" class="ctrl-btn danger" disabled title="مغادرة">Leave</button>
        </div>
      </div>
      <div id="meetGrid" class="meet-grid" aria-live="polite"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
